<link href="//maxcdn.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css" rel="stylesheet" id="bootstrap-css">
<script src="//maxcdn.bootstrapcdn.com/bootstrap/4.1.1/js/bootstrap.min.js"></script>
<script src="//cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>

<div class="containerbackground">
  <div>
    <app-navbar [user]="this.user"></app-navbar>
  </div>
  <div class="container emp-profile">
    <form method="post">
      <div class="row">
        <div class="col-md-4">

        </div>
        <div class="col-md-6">
          <div class="profile-head">
            <h5>
              Perfil de Usuario
            </h5>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-12">
          <div class="tab-content profile-tab" id="myTabContent">
            <div class="tab-pane fade show active" id="home" role="tabpanel">
              <div class="row">
                <div class="col-md-6"><label>ID</label></div>
                <div class="col-md-6"><p>{{ user.id }}</p></div>
              </div>
              <div class="row">
                <div class="col-md-6"><label>Nombre</label></div>
                <div class="col-md-6"><p>{{ user.firstname }}</p></div>
              </div>
              <div class="row">
                <div class="col-md-6"><label>Apellido</label></div>
                <div class="col-md-6"><p>{{ user.lastname }}</p></div>
              </div>
              <div class="row">
                <div class="col-md-6"><label>Email</label></div>
                <div class="col-md-6"><p>{{ user.email }}</p></div>
              </div>
              <div class="row">
                <div class="col-md-6"><label>Teléfono</label></div>
                <div class="col-md-6"><p>{{ user.phone }}</p></div>
              </div>
              <div class="row">
                <div class="col-md-6"><label>Activo</label></div>
                <div class="col-md-6"><p>{{ user.active ? 'Sí' : 'No' }}</p></div>
              </div>
              <div class="row">
                <div class="col-md-6"><label>Rol</label></div>
                <div class="col-md-6"><p>{{ user.role }}</p></div>
              </div>
              <div class="row">
                <div class="col-md-6"><label>Fecha de Nacimiento</label></div>
                <div class="col-md-6"><p>{{ user.birthday | date }}</p></div>
              </div>
              <div class="row">
                <div class="col-md-6"><label>DNI</label></div>
                <div class="col-md-6"><p>{{ user.DNI }}</p></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </form>
    <div>
      <div style="text-align: center">

        <a
          class="btn btn-secondary"
          [routerLink]="['/home',]">
          Volver al home
        </a>
      </div>
    </div>
  </div>
</div>
