<div class="fondo">
  <div class="wrapper">
    <div class="body">
      <form action="">
        <img
          src="diego.jpg"
          class="logo"
          alt=""
        />
        <h1 class="mb-4 mt-3 text-white">Registro</h1>
        <div class="form-floating mb-3">
          <input
            type="email"
            name="name"
            class="form-control"
            [(ngModel)]="name"
            id="floatingInput"
            placeholder="name@example.com"
          />
          <label for="floatingInput">Nombre</label>
        </div>

        <div class="form-floating mb-3">
          <input
            name="lastname"
            type="email"
            class="form-control"
            [(ngModel)]="lastname"
            id="floatingInput"
            placeholder="name@example.com"
          />
          <label for="floatingInput">Apellido</label>
        </div>

        <div class="form-floating mb-3">
          <input
            type="date"
            class="form-control"
            [(ngModel)]="birthdate"
            id="floatingInput"
            placeholder="Fecha de nacimiento"
            name="birthday"
          />
          <label for="floatingInput">Fecha de nacimiento</label>
        </div>


        <div class="form-floating mb-3">
          <input
            name="email"
            type="email"
            class="form-control"
            [(ngModel)]="email"
            id="floatingInput"
            placeholder="name@example.com"
          />
          <label for="floatingInput">Email</label>
        </div>

        <div class="form-floating mb-3">
          <input
            name="password"
            type="password"
            class="form-control"
            [(ngModel)]="password"
            id="floatingPassword"
            placeholder="Password"
          />
          <label for="floatingPassword">Contraseña</label>
        </div>

        <div class="form-floating mb-3">
          <input
            name="DNI"
            type="number"
            class="form-control"
            [(ngModel)]="DNI"
            id="floatingInput"
            placeholder="name@example.com"
          />
          <label for="floatingInput">DNI</label>
        </div>



        <!--      <div class="form-floating mb-3">-->
        <!--        <input-->
        <!--          type="password"-->
        <!--          class="form-control"-->
        <!--          [(ngModel)]="repeatPassword"-->
        <!--          id="floatingrepeatPassword"-->
        <!--          placeholder="Password"-->
        <!--        />-->
        <!--        <label for="floatingrepeatPassword">Repetir contraseña</label>-->
        <!--      </div>-->

        <div class="form-floating mb-3">
          <input
            name="phone"
            type="email"
            class="form-control"
            [(ngModel)]="phone"
            id="floatingInput"
            placeholder="name@example.com"
          />
          <label for="floatingInput">Celular</label>
        </div>
        <div class="d-grid gap-2">
          <button class="btn btn-primary" (click)="registerUser()" type="button">Registrarme</button>
        </div>
        <div>
          <p class="mt-3">
            <a routerLink="/login">Volver</a>
          </p>
        </div>
      </form>
    </div>
  </div>
</div>
