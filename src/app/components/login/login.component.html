<div class="wrapper">
  <div class="body">
    <form action="">
      <img
        src="/Users/lautaroolmedo/NodeJS/canchitas-libres-angular/assets/diego.jpg"
        class="logo"
        alt=""
      />

      <h1 class="mb-4 mt-3">Inicio de sesión</h1>
      <div class="form-floating mb-3">
        <input
          [(ngModel)]="email"
          type="email"
          class="form-control"
          id="floatingInput"
          placeholder="name@example.com"
        />
        <label for="floatingInput">Email address</label>
      </div>
      <div class="form-floating mb-3">
        <input
          [(ngModel)]="password"
          type="password"
          class="form-control"
          id="floatingPassword"
          placeholder="Password"
        />
        <label for="floatingPassword">Password</label>
      </div>
      <div class="d-grid gap-2">
        <button class="btn btn-primary" (click)="getUser()" type="button">
          Iniciar Sesión
        </button>
      </div>
      <div>
        <p class="mt-3">
          ¿No tengo cuenta? <a routerLink="/register">Registrarme</a>
        </p>
      </div>
    </form>
  </div>
</div>
